packages:
  - "apps/*"
  - "packages/*"

overrides:
  baseline-browser-mapping: 2.10.30
  # fetch-blob@3.2.0 still lists this in registry metadata; patched code uses native DOMException (Node >=17)
  fetch-blob>node-domexception: "-"

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - sharp

allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true

patchedDependencies:
  fetch-blob@3.2.0: patches/fetch-blob@3.2.0.patch
